[project]
name = "nebius-nvidia"
version = "0.1.0"
description = "Denial Auditor: criterion-level evidence and verified appeals for MRI/CT insurance denials (Nemotron on Nebius Token Factory + Tavily)"
requires-python = ">=3.10"
dependencies = [
    "tavily-python>=0.8.5",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_nvidia"]
