[project]
name = "nebius-nvidia"
version = "0.1.0"
description = "Denial Auditor: criterion-level evidence and verified appeals for MRI/CT insurance denials (Nemotron on Nebius Token Factory + Tavily)"
requires-python = ">=3.10"
dependencies = [
    "tavily-python>=0.8.5",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
app = [
    "streamlit>=1.40",
    "altair>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_nvidia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs and spends credits; runs only with RUN_LIVE=1"]
